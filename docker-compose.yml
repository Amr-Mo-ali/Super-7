services:
  football-analysis:
    build:
      context: .
    image: football-analysis:local
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
      - /data/videos:/videos:ro
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8000/openapi.json', timeout=3); assert response.status == 200"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
