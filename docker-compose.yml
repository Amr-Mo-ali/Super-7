services:
  football-analysis:
    build:
      context: .
    image: football-analysis:local
    # Production roles require a reviewed deployment topology. The image CMD
    # exits before opening a port when no role command is supplied.
    env_file:
      - .env
    environment:
      SUPER7_VIDEO_SOURCE: r2
      SUPER7_R2_ENDPOINT: ${SUPER7_R2_ENDPOINT:?Set the R2 endpoint}
      SUPER7_R2_ACCESS_KEY_ID: ${SUPER7_R2_ACCESS_KEY_ID:?Set the R2 read-only access key}
      SUPER7_R2_SECRET_ACCESS_KEY: ${SUPER7_R2_SECRET_ACCESS_KEY:?Set the R2 read-only secret key}
    volumes:
      - ./models:/models:ro
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8000/health/live', timeout=3); assert response.status == 200"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
