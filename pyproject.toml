[project]
name = "football-analysis"
version = "0.1.0"
description = "Single-endpoint football video tracking MVP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "opencv-python-headless>=4.10,<5",
  "pydantic>=2,<3",
  "python-multipart>=0.0.9,<1",
  "ultralytics>=8.3,<9",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pre-commit>=4.0,<5",
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/core", "src/schemas", "src/services"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".mypy_cache", ".pytest_cache", ".ruff_cache", ".uv-cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
