services:
  backend-mock:
    build:
      context: .
      dockerfile: integration/backend_mock/Dockerfile
    ports:
      - "8081:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8080/health/live', timeout=3).status == 200"
      interval: 5s
      timeout: 3s
      retries: 10

  super-7:
    build:
      context: .
    env_file:
      - .env
    environment:
      VIDEO_STORAGE_ROOT: /videos
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
      - /data/videos:/videos:ro
    depends_on:
      backend-mock:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
